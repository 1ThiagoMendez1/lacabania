name: La Cabaña POS — seguridad básica y compilación

on:
  push:
    branches: [v1.1.3]
  pull_request:
    branches: [v1.1.3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validación y build (sin base de datos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Sintaxis del servicio de impresión
        run: node --check print-service/index.js && node --check print-service/queue-worker.js
